AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Orders API - .NET Serverless Modernization Demo (01 Managed Runtime)

Parameters:
  AllowedCidr:
    Type: String
    Description: IPv4 CIDR allowed to POST /orders, e.g. 203.0.113.0/24
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$'

Globals:
  Function:
    Timeout: 30
    MemorySize: 2048

Resources:
  OrdersTable:
    Type: AWS::DynamoDB::Table
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_119
            comment: >-
              Demo table of synthetic orders. Encrypted at rest with the
              AWS owned key by default; a customer managed KMS key adds
              cost and key policy outside the scope of this sample.
          - id: CKV_AWS_28
            comment: >-
              Short-lived demo table of synthetic orders, deleted by
              Remove-OrdersApi.ps1 when you're done. Point-in-time recovery
              would have nothing worth restoring.
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: OrderId
          AttributeType: S
      KeySchema:
        - AttributeName: OrderId
          KeyType: HASH

  # Declared explicitly only for AlwaysDeploy. API Gateway applies a resource
  # policy change only on a new deployment, and SAM's deployment hash doesn't
  # see the AllowedCidr value, so without it a new CIDR would never take
  # effect and the old one would keep access.
  OrdersRestApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: Prod
      AlwaysDeploy: true

  OrdersFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: OrdersApi
      Runtime: dotnet10
      CodeUri: src/OrdersApi/
      Architectures:
        - arm64
      Environment:
        Variables:
          ORDERS_TABLE_NAME: !Ref OrdersTable
          POWERTOOLS_SERVICE_NAME: "OrdersApi"
          POWERTOOLS_LOG_LEVEL: "Information"
          POWERTOOLS_LOGGER_CASE: "CamelCase"
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
              Resource: !GetAtt OrdersTable.Arn
      Events:
        # No authorizer on POST /orders, on purpose. This is a demo of
        # cold-start latency on synthetic data, meant to be torn down after
        # use, so it stays focused on cold start and leaves auth out.
        # A resource policy limits the route to the AllowedCidr source range
        # instead. That narrows who can call it but doesn't authenticate
        # anyone, so before reusing this template, add IAM, Cognito or a
        # Lambda authorizer.
        CreateOrder:
          Type: Api
          Properties:
            RestApiId: !Ref OrdersRestApi
            Path: /orders
            Method: POST
            Auth:
              ResourcePolicy:
                # The Allow is required. Once a REST API has a resource
                # policy, anything it doesn't allow is denied - GET /health
                # included. The Deny then carves out POST /orders.
                CustomStatements:
                  - Effect: Allow
                    Principal: '*'
                    Action: execute-api:Invoke
                    Resource: execute-api:/*
                  - Effect: Deny
                    Principal: '*'
                    Action: execute-api:Invoke
                    Resource: execute-api:/*/POST/orders
                    Condition:
                      NotIpAddress:
                        aws:SourceIp: !Ref AllowedCidr
        CheckHealth:
          Type: Api
          Properties:
            RestApiId: !Ref OrdersRestApi
            Path: /health
            Method: GET

Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub "https://${OrdersRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod"
  FunctionName:
    Description: Orders Lambda function name (used by bench scripts)
    Value: !Ref OrdersFunction
  OrdersFunctionArn:
    Description: Orders Lambda function ARN
    Value: !GetAtt OrdersFunction.Arn
